name: CSQAQ Scrape Home

on:
  workflow_dispatch:
    inputs:
      indices:
        description: '逗号分隔的指数 ID（默认全部）'
        required: false
        default: ''
      periods:
        description: '逗号分隔的周期（默认 daily）'
        required: false
        default: ''

concurrency:
  group: scrape-home-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install playwright
        run: pip install playwright

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium

      - name: Download last result for incremental mode
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN=$(gh run list --workflow="scrape_home.yml" --status=success --limit=1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$LAST_RUN" ]; then
            echo "Downloading last result from run $LAST_RUN..."
            gh run download $LAST_RUN --name home_result -D /tmp/last_result || echo "No artifact found, will run full mode"
            if [ -f "/tmp/last_result/home_result.json" ]; then
              cp /tmp/last_result/home_result.json last_home_result.json
              echo "last_home_result.json ready for incremental mode"
            fi
          else
            echo "No previous successful run, will run full mode"
          fi

      - name: Run scrape_home
        env:
          INPUT_INDICES: ${{ github.event.inputs.indices }}
          INPUT_PERIODS: ${{ github.event.inputs.periods }}
        run: |
          ARGS=""
          if [ -n "$INPUT_INDICES" ]; then
            ARGS="$ARGS --indices $INPUT_INDICES"
          fi
          if [ -n "$INPUT_PERIODS" ]; then
            ARGS="$ARGS --periods $INPUT_PERIODS"
          fi
          python scrape_home.py $ARGS

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home_result
          path: home_result.json
